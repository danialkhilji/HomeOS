services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/homeos.db
      - DEBUG=False
      - CORS_ORIGINS=["*"]
      - WEATHER_LATITUDE=${WEATHER_LATITUDE:-51.5074}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE:-0.1278}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite-data:
